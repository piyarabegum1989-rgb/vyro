<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>VYRO — Connect. Create. Share.</title>
<style>
:root{--bg:#0b0e14;--card:#131722;--card2:#1a2030;--line:#242c3f;--txt:#f2f4f9;--mut:#8b94a9;--acc:#7c8cf8;--pink:#ec4899;--vio:#7c3aed;--link:#a5b0fa;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 13px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.light{background:#e8ebf5;color:#0b0e14}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:#3a4560}
.btn.danger{background:#dc2626}
.btn.sm{padding:8px 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);border-color:var(--acc);color:#0b0e14}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase}
.badge.ok{background:rgba(34,197,94,.14);color:#4ade80}.badge.beta{background:rgba(124,140,248,.16);color:#c3cbfc}
.badge.soon{background:rgba(245,158,11,.14);color:#fbbf24}.badge.new{background:rgba(236,72,153,.16);color:#f9a8d4}
.avatar{border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--card2)}
.row{display:flex;gap:10px}
/* navbar */
.navbar{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(11,14,20,.92);border-bottom:1px solid var(--line)}
.navin{max-width:1400px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:10px}
.navsearch{max-width:260px;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;flex:1}
.navsearch input{background:none;border:0;padding:0;width:100%}
.ctabs{display:flex;flex:1;justify-content:center;gap:4px;height:60px}
.ctab{background:none;border:0;color:var(--mut);padding:0 34px;border-bottom:3px solid transparent;display:flex;align-items:center;position:relative}
.ctab:hover{background:var(--card2);color:var(--txt)}
.ctab.on{color:var(--acc);border-bottom-color:var(--acc)}
.nbtn{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.nbtn:hover{border-color:#3a4560}
.nbtn .bdg{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(max-width:900px){.ctabs,.navsearch{display:none}}
/* layout */
.layout{max-width:1400px;margin:0 auto;padding:76px 16px 40px;display:grid;grid-template-columns:280px minmax(0,620px) 300px;gap:22px;justify-content:center}
@media(max-width:1240px){.layout{grid-template-columns:250px minmax(0,620px)}.rrail{display:none}}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,620px);padding:70px 10px 100px}.lrail{display:none}}
.rail{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sideitem{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14.5px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.sideitem:hover{background:var(--card2)}
.sideitem.on{background:var(--card2)}
.sideitem .sic{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--link);flex-shrink:0}
.rsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 4px 8px}
.contact{display:flex;align-items:center;gap:11px;padding:8px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.contact:hover{background:var(--card2)}
.onwrap{position:relative;flex-shrink:0}
.ondot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--bg)}
/* stories + composer */
.stories{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px}
.story{position:relative;height:185px;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.story img.bg{width:100%;height:100%;object-fit:cover;transition:.2s}
.story:hover img.bg{transform:scale(1.04)}
.story .sav{position:absolute;top:9px;left:9px;border:2.5px solid var(--acc);border-radius:50%}
.story .snm{position:absolute;bottom:9px;left:9px;right:9px;font-size:12px;font-weight:700;text-shadow:0 1px 5px #000}
.story.create{background:var(--card)}
.story.create .ph{height:130px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.story.create .plus{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#0b0e14;display:flex;align-items:center;justify-content:center;margin:-19px auto 8px;position:relative;border:3px solid var(--card)}
.composer{display:flex;gap:11px;align-items:center;margin-bottom:16px}
.fakeinput{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:12px 18px;color:var(--mut);cursor:pointer;font-size:14.5px}
.fakeinput:hover{border-color:#3a4560}
.cactions{display:flex;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.cactions button{flex:1;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;font-weight:600;font-size:13.5px;color:var(--mut);border-radius:10px}
.cactions button:hover{background:var(--card2);color:var(--txt)}
/* post */
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.post .ph{display:flex;align-items:center;gap:11px;padding:13px 15px 10px}
.post .ph .nm{font-weight:700;font-size:14.5px;cursor:pointer}
.post .ph .sub{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:4px}
.post .txt{padding:2px 15px 12px;font-size:14.5px;line-height:1.55}
.post .txt.big{font-size:26px;font-weight:800;text-align:center;padding:44px 30px;background:linear-gradient(135deg,#312e81,#7c3aed,#db2777);margin:0 0 4px}
.post img.media{width:100%;max-height:540px;object-fit:cover;display:block;background:#0a0c11}
.counts{display:flex;align-items:center;gap:8px;padding:10px 15px;font-size:13.5px;color:var(--mut)}
.rstack{display:flex;align-items:center}
.rstack span{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1.5px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;margin-left:-6px}
.rstack span:first-child{margin-left:0}
.abar{display:flex;border-top:1px solid var(--line);margin:0 12px;padding:5px 0}
.abar button{flex:1;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;font-weight:600;font-size:13.5px;color:var(--mut);border-radius:9px;position:relative}
.abar button:hover{background:var(--card2)}
.cbox{padding:4px 15px 14px}
.cmtrow{display:flex;gap:9px;margin-top:10px}
.cmtb{background:var(--card2);border-radius:14px;padding:8px 13px;font-size:13.5px;flex:1}
.like-wrap{position:relative;flex:1;display:flex}
.picker{position:absolute;bottom:calc(100% + 8px);left:0;background:#222839;border:1px solid #333d58;border-radius:999px;padding:7px 11px;display:flex;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
.picker span{font-size:27px;cursor:pointer;transition:.12s;border-radius:50%}
.picker span:hover{transform:scale(1.35)}
.sharedbox{margin:0 15px 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sharedbox .sh{font-size:12.5px;color:var(--mut);padding:9px 12px 0}
.sharedbox img{width:100%;max-height:260px;object-fit:cover;display:block;margin-top:8px}
/* grids + cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.gcard:hover{border-color:#3a4560}
.gcard img.cov{width:100%;height:110px;object-fit:cover;display:block}
.gcard .gi{padding:12px}
.gcard h4{font-size:14.5px;margin-bottom:3px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.mcard:hover{border-color:#3a4560}
.mcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mcard .mi{padding:10px}
.mcard .pr{font-weight:800;font-size:15px}
.evcard{display:flex;gap:14px;align-items:center}
.evdate{width:58px;height:62px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.evdate b{font-size:20px}.evdate span{font-size:11px;color:var(--pink);font-weight:800}
.orb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0}
.vibe{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.vibe i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#ec4899)}
/* profile */
.cover{height:220px;border-radius:16px;object-fit:cover;width:100%;display:block}
.phead{display:flex;align-items:flex-end;gap:16px;margin-top:-42px;padding:0 16px}
.phead img.pav{width:120px;height:120px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:var(--card2)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:16px 0}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font-weight:700;padding:13px;border-bottom:2px solid transparent;font-size:14px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
/* security */
.ring{position:relative;width:130px;height:130px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.factor{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.factor:last-child{border-bottom:0}
.setic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--link);flex-shrink:0}
.switch{position:relative;width:50px;height:29px;flex-shrink:0}
.switch input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:2;margin:0}
.sw{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:999px;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:4px;width:21px;height:21px;border-radius:50%;background:var(--mut);transition:.2s}
.switch input:checked+.sw{background:var(--acc);border-color:var(--acc)}
.switch input:checked+.sw::after{left:23px;background:#fff}
.sess{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.actrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
/* modal/drawer/toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto}
.modal{background:#141927;border:1px solid var(--line);border-radius:18px;width:100%;max-width:540px;padding:20px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.err{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.4);color:#fca5a5;padding:10px 13px;border-radius:10px;font-size:14px;margin-bottom:12px}
.okmsg{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#86efac;padding:10px 13px;border-radius:10px;font-size:14px;margin-bottom:12px}
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:#10141f;z-index:70;padding:18px 14px;overflow-y:auto;border-right:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:65}
.dd{position:absolute;top:56px;right:0;width:280px;background:#141927;border:1px solid var(--line);border-radius:16px;padding:10px;z-index:50;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toasts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1e2434;border:1px solid #3a4560;border-radius:12px;padding:11px 20px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.6);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.topbarM{display:none;position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(11,14,20,.94);border-bottom:1px solid var(--line);padding:10px 14px;align-items:center;gap:10px}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(11,14,20,.96);border-top:1px solid var(--line);padding:8px 2px}
.bottomnav .row{display:flex;justify-content:space-around}
.bottomnav button{background:none;border:0;padding:8px 12px;color:var(--mut);position:relative}
.bottomnav button.on{color:var(--acc)}
@media(max-width:900px){.navbar{display:none}.topbarM{display:flex}.bottomnav{display:block}}
/* landing/auth */
.nav{position:sticky;top:0;z-index:20;background:rgba(11,14,20,.88);border-bottom:1px solid var(--line)}
.navin{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center}
.hero{max-width:1100px;margin:0 auto;padding:56px 20px 10px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,60px);font-weight:800;letter-spacing:-2px;line-height:1.05;margin-bottom:14px}
.hero h1 .g{background:linear-gradient(135deg,#a5b0fa,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:16.5px;color:var(--mut);line-height:1.6;margin-bottom:24px;max-width:480px}
.phone{width:285px;margin:0 auto;border:1px solid #333d58;border-radius:42px;padding:11px;background:#0a0d13;box-shadow:0 30px 80px rgba(124,58,237,.28)}
.phone .scr{border-radius:32px;overflow:hidden;background:#000}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px;max-width:1100px;margin:40px auto;padding:0 20px}
.feat .f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.feat .ic{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--link);margin-bottom:11px}
.feat .f h3{font-size:14.5px;margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.feat .f p{font-size:13px;color:var(--mut);line-height:1.5}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{width:100%;max-width:400px}
.watchcard{position:relative;border-radius:16px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);cursor:pointer}
.watchcard img{width:100%;height:420px;object-fit:cover;display:block}
.watchcard .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.82))}
.watchcard .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff}
.watchcard .meta{position:absolute;bottom:0;left:0;right:0;padding:15px}
.watchcard .dur{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:700}
.msgwrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.citem{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.citem:hover,.citem.on{background:var(--card2)}
.bubble{max-width:76%;padding:10px 14px;border-radius:18px;font-size:14px;margin:3px 14px;line-height:1.45;width:fit-content}
.bubble.me{margin-left:auto;background:#4f46e5;color:#fff;border-bottom-right-radius:5px}
.bubble.them{background:var(--card2);border-bottom-left-radius:5px}
.tsend{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line)}
.center{text-align:center}.lock{text-align:center;padding:44px 16px}
.covpick{display:flex;gap:8px;flex-wrap:wrap}
.covpick img,.covpick .txtopt{width:80px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent;opacity:.6}
.covpick img.on,.covpick .txtopt.on{border-color:var(--acc);opacity:1}
.covpick .txtopt{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#312e81,#db2777);font-weight:900;font-size:22px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:10px;font-weight:700;font-size:14px}
.seg button.on{background:#e8ebf5;color:#0b0e14}
/* clean animated sign-in */
.authlogo{display:flex;justify-content:center;margin-bottom:20px;animation:authIn .65s cubic-bezier(.2,.8,.2,1)}
.authlogo>span{animation:logoPulse 2.2s ease-in-out infinite}.authbox .card{animation:cardUp .55s .1s both cubic-bezier(.2,.8,.2,1)}
@keyframes authIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}@keyframes cardUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes logoPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 0 10px rgba(124,58,237,.09)}}
/* music post + mobile install */
.musicbar{display:flex;align-items:center;gap:10px;margin:0 15px 12px;padding:10px 11px;border:1px solid var(--line);background:var(--card2);border-radius:12px}
.musicbar .mn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899);flex-shrink:0}
.musicbar .mt{display:flex;flex-direction:column;min-width:0;flex:1}.musicbar .mt b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.musicbar .mt span{font-size:11.5px;color:var(--mut);margin-top:2px}.musicbar audio{height:32px;width:190px;max-width:38%}
.musicsel{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);background:var(--card2);border-radius:10px}.musicsel .grow{min-width:0;flex:1}.musicsel b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.musicsel small{color:var(--mut);font-size:11px}.filepick{border:1px dashed #3a4560;border-radius:10px;padding:10px;font-size:13px;color:var(--mut);width:100%;cursor:pointer}.filepick:hover{border-color:var(--acc);color:var(--txt)}

function U(un){return S.users.find(function(u){return u.username===un;})||{username:un,name:un,bio:'',priv:false};}
function friendsWith(a,b){return (S.friends[a]||[]).indexOf(b)>=0;}
function canView(un){var u=U(un);if(!u.priv)return true;if(un===S.me)return true;return friendsWith(S.me,un);}
function audOK(p){if(p.user===S.me)return true;if(p.aud==='onlyme')return false;if(p.aud==='friends')return friendsWith(S.me,p.user);return true;}
function visiblePosts(){return S.posts.filter(function(p){if(S.blocked.indexOf(p.user)>=0)return false;if(p.user!==S.me&&!canView(p.user))return false;return audOK(p);});}
function trending(){var c={};visiblePosts().forEach(function(p){(p.cap.match(/#[\p{L}\p{N}_]+/gu)||[]).forEach(function(t){var k=t.toLowerCase();c[k]=(c[k]||0)+1;});});return Object.keys(c).map(function(k){return {t:k,n:c[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0,8);}
function likeTotal(p){var t=0;for(var k in p.likes)t+=p.likes[k];return t;}
function likeTop(p){return Object.keys(p.likes).filter(function(k){return p.likes[k]>0;}).sort(function(a,b){return p.likes[b]-p.likes[a];}).slice(0,3);}
function score(){var s=S.sec,v=20;if(s.twoFA)v+=20;if(s.alerts)v+=15;if(s.priv)v+=15;if(s.strong)v+=15;if(s.verified)v+=15;return v;}

function aiSuggest(cap,loc){var text=((cap||'')+' '+(loc||'')).toLowerCase(),out=[];RULES.forEach(function(r){if(r.k.some(function(k){return text.indexOf(k)>=0;}))r.t.forEach(function(t){if(out.indexOf(t)<0)out.push(t);});});if(text.indexOf('dhaka')>=0&&out.indexOf('#dhaka')<0)out.push('#dhaka');if(text.indexOf('sylhet')>=0&&out.indexOf('#sylhet')<0)out.push('#sylhet');if(text.indexOf('cox')>=0)out.push('#coxsbazar');out.push('#vyro');if(out.length<4)out.push('#trending','#viral');return out.slice(0,10);}

function render(){
  var h='';
  if(!S.me){h=S.view==='signup'?vSignup():S.view==='login'?vLogin():vLanding();}
  else if(S.view==='feed')h=vFeed();
  else if(S.view==='watch')h=vWatch();
  else if(S.view==='groups')h=vGroups();
  else if(S.view==='group')h=vGroup(S.group);
  else if(S.view==='market')h=vMarket();
  else if(S.view==='circles')h=vCircles();
  else if(S.view==='friends')h=vFriends();
  else if(S.view==='memories')h=vMemories();
  else if(S.view==='events')h=vEvents();
  else if(S.view==='pages')h=vPages();
  else if(S.view==='saved')h=vSaved();
  else if(S.view==='profile')h=vProfile(S.profile);
  else if(S.view==='messages')h=vMessages();
  else if(S.view==='notifications')h=vNotifs();
  else if(S.view==='security')h=vSecurity();
  else if(S.view==='settings')h=vSettings();
  else if(S.view==='search')h=vSearch();
  else h=vFeed();
  document.getElementById('app').innerHTML=h;
}
try{S.accounts=JSON.parse(localStorage.getItem('vyroAccounts')||'[]');S.accounts.forEach(function(ac){if(!S.users.some(function(u){return u.username===ac.username;})){S.users.push({username:ac.username,name:ac.name,bio:'',priv:false,lives:'Bangladesh',joined:'Recently'});S.friends[ac.username]=[];}});}catch(e){}

window.addEventListener('appinstalled',function(){window.vyroInstallPrompt=null;toast('VYRO installed on your device');});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
render();
